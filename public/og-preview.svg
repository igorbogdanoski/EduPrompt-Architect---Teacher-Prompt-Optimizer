<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep dark canvas -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle Blueprint grid -->
  <g stroke="#374151" stroke-width="0.75" stroke-opacity="0.35">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="150" r="240" fill="#4338ca" opacity="0.25" filter="url(#glowEffect)" />
  <circle cx="1050" cy="450" r="260" fill="#0284c7" opacity="0.2" filter="url(#glowEffect)" />
  <circle cx="650" cy="300" r="180" fill="#7c3aed" opacity="0.15" filter="url(#glowEffect)" />

  <!-- Left Column: Branding, Title, Tagline -->
  <g transform="translate(80, 90)">
    <!-- App Badge -->
    <rect width="260" height="36" rx="18" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1.5" />
    <circle cx="18" cy="18" r="6" fill="#10b981" />
    <text x="32" y="23" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#a5b4fc" letter-spacing="0.5">MATHDIGITIZER PRO · EdTech</text>

    <!-- Main Title -->
    <text x="0" y="95" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">
      EduPrompt Architect
    </text>
    <text x="0" y="145" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="36" font-weight="700" fill="url(#primaryGrad)">
      Платформа за Математичка Едукација
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="200" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="400" fill="#9ca3af">
      Професионален оптимизатор на наставнички промптови, 45-минутни временски оски,
    </text>
    <text x="0" y="228" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="400" fill="#9ca3af">
      Zero-Error LaTeX KaTeX нотација и NanoBanana AI векторски технички илустрации.
    </text>

    <!-- Key Feature Pills -->
    <g transform="translate(0, 270)">
      <!-- Pill 1: Timeline -->
      <rect x="0" y="0" width="150" height="34" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="14" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e5e7eb">⏱ 45-Min Timeline</text>

      <!-- Pill 2: Bloom Matrix -->
      <rect x="162" y="0" width="165" height="34" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="176" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e5e7eb">🎓 Блумова Таксономија</text>

      <!-- Pill 3: Adaptive Difficulty -->
      <rect x="339" y="0" width="180" height="34" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="353" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e5e7eb">⚡ Авто-Адаптивно Ниво</text>
    </g>

    <!-- Secondary Pills -->
    <g transform="translate(0, 316)">
      <!-- Pill 4: NanoBanana -->
      <rect x="0" y="0" width="200" height="34" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text x="14" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#c7d2fe">🎨 NanoBanana AI Вектори</text>

      <!-- Pill 5: KaTeX -->
      <rect x="212" y="0" width="160" height="34" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="226" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e5e7eb">📐 KaTeX &amp; LaTeX</text>

      <!-- Pill 6: Tree-of-Thoughts -->
      <rect x="384" y="0" width="165" height="34" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="398" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e5e7eb">🌲 Tree-of-Thoughts</text>
    </g>

    <!-- Public Training Presentation Flag -->
    <g transform="translate(0, 395)">
      <rect x="0" y="0" width="460" height="42" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
      <circle cx="22" cy="21" r="5" fill="#38bdf8" />
      <text x="38" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#93c5fd">
        Спремно за наставничка обука и јавна презентација
      </text>
    </g>
  </g>

  <!-- Right Column: Interactive UI Showcase Mockup Card -->
  <g transform="translate(680, 80)">
    <!-- Main Card Container -->
    <rect width="460" height="470" rx="18" fill="url(#cardBg)" stroke="#374151" stroke-width="1.5" />
    
    <!-- Window Topbar -->
    <rect width="460" height="38" rx="18" fill="#111827" />
    <rect x="0" y="20" width="460" height="18" fill="#111827" />
    <circle cx="22" cy="19" r="5" fill="#ef4444" />
    <circle cx="38" cy="19" r="5" fill="#eab308" />
    <circle cx="54" cy="19" r="5" fill="#22c55e" />
    <text x="75" y="23" font-family="'JetBrains Mono', monospace" font-size="11" fill="#6b7280">prompt-optimizer-schema.json</text>

    <!-- Mini Visual Diagram Preview inside card -->
    <g transform="translate(24, 56)">
      <rect width="412" height="160" rx="10" fill="#0b0f19" stroke="#1f2937" />
      
      <!-- Coordinate Grid & Geometry Graphic -->
      <g stroke="#1e293b" stroke-width="1">
        <line x1="20" y1="80" x2="390" y2="80" stroke="#334155" />
        <line x1="200" y1="20" x2="200" y2="140" stroke="#334155" />
      </g>
      <!-- Geometric triangle with labeled right angle -->
      <polygon points="120,120 280,120 280,40" fill="#4f46e5" fill-opacity="0.25" stroke="#818cf8" stroke-width="2.5" />
      <rect x="264" y="104" width="16" height="16" fill="none" stroke="#a5b4fc" stroke-width="1.5" />
      <!-- Formula annotations -->
      <text x="180" y="138" font-family="serif" font-size="14" font-style="italic" fill="#38bdf8">a = 4</text>
      <text x="290" y="85" font-family="serif" font-size="14" font-style="italic" fill="#38bdf8">b = 3</text>
      <text x="175" y="70" font-family="serif" font-size="14" font-style="italic" fill="#fbbf24">c = 5</text>
      <text x="32" y="36" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#34d399">✓ NanoBanana Vector Preview</text>
      <text x="32" y="145" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">a² + b² = c² (Pytagorean Theorem)</text>
    </g>

    <!-- Timeline Phases Preview inside card -->
    <g transform="translate(24, 230)">
      <text x="0" y="14" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#e5e7eb">45-Минутна Временска Оска на Час</text>
      
      <!-- Timeline Phase 1 -->
      <rect x="0" y="24" width="98" height="38" rx="6" fill="#1e1b4b" stroke="#4338ca" />
      <text x="8" y="40" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#a5b4fc">00-08 min</text>
      <text x="8" y="54" font-family="system-ui, sans-serif" font-size="9" fill="#c7d2fe">Вовед &amp; Активација</text>

      <!-- Timeline Phase 2 -->
      <rect x="104" y="24" width="98" height="38" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="112" y="40" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">08-22 min</text>
      <text x="112" y="54" font-family="system-ui, sans-serif" font-size="9" fill="#93c5fd">Водено Истражување</text>

      <!-- Timeline Phase 3 -->
      <rect x="208" y="24" width="98" height="38" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="216" y="40" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#34d399">22-37 min</text>
      <text x="216" y="54" font-family="system-ui, sans-serif" font-size="9" fill="#a7f3d0">Самостојна Работа</text>

      <!-- Timeline Phase 4 -->
      <rect x="312" y="24" width="100" height="38" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="320" y="40" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fbbf24">37-45 min</text>
      <text x="320" y="54" font-family="system-ui, sans-serif" font-size="9" fill="#fde68a">Евалуација &amp; Ексит</text>
    </g>

    <!-- Code Block Preview -->
    <g transform="translate(24, 310)">
      <rect width="412" height="135" rx="8" fill="#030712" stroke="#1f2937" />
      <text x="14" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#e5e7eb">
        <tspan fill="#ec4899">"lesson_timeline"</tspan>: [
      </text>
      <text x="28" y="42" font-family="'JetBrains Mono', monospace" font-size="11" fill="#e5e7eb">
        { <tspan fill="#38bdf8">"phase"</tspan>: <tspan fill="#34d399">"Вовед и Когнитивна Активација"</tspan>, <tspan fill="#fbbf24">"duration_min"</tspan>: 8 },
      </text>
      <text x="14" y="66" font-family="'JetBrains Mono', monospace" font-size="11" fill="#e5e7eb">
        <tspan fill="#ec4899">"visual_assets"</tspan>: [
      </text>
      <text x="28" y="86" font-family="'JetBrains Mono', monospace" font-size="11" fill="#e5e7eb">
        { <tspan fill="#38bdf8">"format"</tspan>: <tspan fill="#34d399">"SVG / TikZ"</tspan>, <tspan fill="#fbbf24">"pedagogical_purpose"</tspan>: <tspan fill="#34d399">"Dual Coding"</tspan> }
      </text>
      <text x="14" y="112" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9ca3af">
        // Zero-error LaTeX, Minimal JSON &amp; CoT
      </text>
    </g>
  </g>
</svg>
