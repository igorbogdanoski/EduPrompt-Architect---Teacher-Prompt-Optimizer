<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="#4f46e5" stroke-width="2" stroke-opacity="0.5" />

  <!-- Grid lines subtle -->
  <line x1="20" y1="44" x2="108" y2="44" stroke="#4338ca" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="2,3" />
  <line x1="20" y1="64" x2="108" y2="64" stroke="#4338ca" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="2,3" />
  <line x1="20" y1="84" x2="108" y2="84" stroke="#4338ca" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="2,3" />
  <line x1="44" y1="20" x2="44" y2="108" stroke="#4338ca" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="2,3" />
  <line x1="64" y1="20" x2="64" y2="108" stroke="#4338ca" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="2,3" />
  <line x1="84" y1="20" x2="84" y2="108" stroke="#4338ca" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="2,3" />

  <!-- Mathematical Sigma / Architect Symbol -->
  <path d="M 88 34 L 40 34 L 66 64 L 40 94 L 88 94" 
        fill="none" 
        stroke="url(#sparkGrad)" 
        stroke-width="9" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- NanoBanana Spark / Prompt Sparkle -->
  <circle cx="86" cy="40" r="5" fill="url(#goldGrad)" />
  <path d="M 98 52 Q 102 60 110 64 Q 102 68 98 76 Q 94 68 86 64 Q 94 60 98 52 Z" 
        fill="url(#goldGrad)" />

  <!-- Mini dot grid highlight -->
  <circle cx="66" cy="64" r="3" fill="#ffffff" />
</svg>
